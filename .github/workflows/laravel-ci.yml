name: NACOC Forensic Portal CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    name: Run Automated Security & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nacoc_forensic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, ctype, json, openssl, tokenizer, xml
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy Testing Environment File
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Database Migrations (Testing Environment)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nacoc_forensic_test
          DB_USERNAME: postgres
          DB_PASSWORD: secretpassword
        run: php artisan migrate --force

      - name: Check PHP Syntax Across All Controllers & Views
        run: |
          find app resources/views routes -name "*.php" -exec php -l {} \;

      - name: Execute Automated Unit & Feature Test Suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nacoc_forensic_test
          DB_USERNAME: postgres
          DB_PASSWORD: secretpassword
        run: php artisan test
